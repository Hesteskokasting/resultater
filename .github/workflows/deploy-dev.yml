name: Deploy to Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  # Runs here first so a broken migration is caught against dev, before the
  # same push runs against prod.
  database:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      # No `supabase link`: it reads project status through the Management API,
      # which needs far wider token scopes than deploying does. --db-url talks
      # straight to Postgres instead, and functions deploy names the project.
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: supabase functions deploy --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    needs: database
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      # vp version is auto-detected from the vite-plus devDependency + lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Replaces the `tsc --noEmit` gate that `npm run build` used to provide;
      # also covers fmt and lint (lint.options.typeCheck is on in vite.config.js).
      - run: vp check
      - run: vp build --base /dev/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_ENV: dev
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: dev
          clean: true
      - name: Ensure .nojekyll at gh-pages root
        run: mkdir nojekyll-root && touch nojekyll-root/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: nojekyll-root
          branch: gh-pages
          clean: false

  publish:
    needs: build-and-deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml

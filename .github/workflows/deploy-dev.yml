name: Deploy to Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      # vp version is auto-detected from the vite-plus devDependency + lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Replaces the `tsc --noEmit` gate that `npm run build` used to provide;
      # also covers fmt and lint (lint.options.typeCheck is on in vite.config.js).
      - run: vp check
      - run: vp build --base /dev/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_ENV: dev
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: dev
          clean: true
      - name: Ensure .nojekyll at gh-pages root
        run: mkdir nojekyll-root && touch nojekyll-root/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: nojekyll-root
          branch: gh-pages
          clean: false

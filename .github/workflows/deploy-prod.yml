name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # First job to touch the prod environment, so its required reviewer is the
  # manual gate for the whole release — nothing reaches the database or the
  # site before it is approved.
  database:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      # No `supabase link`: it reads project status through the Management API,
      # which needs far wider token scopes than deploying does. --db-url talks
      # straight to Postgres instead, and functions deploy names the project.
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: supabase functions deploy --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    needs: database
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      # vp version is auto-detected from the vite-plus devDependency + lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Replaces the `tsc --noEmit` gate that `npm run build` used to provide;
      # also covers fmt and lint (lint.options.typeCheck is on in vite.config.js).
      - run: vp check
      - run: vp build --base /
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
      - name: Add CNAME and disable Jekyll
        run: |
          echo "res.hesteskokasting.no" > dist/CNAME
          touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: dev/

  publish:
    needs: build-and-deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag the released version
        run: |
          version="v$(jq -r .version package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "$version is already tagged – nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

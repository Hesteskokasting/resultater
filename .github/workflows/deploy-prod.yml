name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  godkjenn:
    runs-on: ubuntu-latest
    environment: prod-godkjenning
    steps:
      - run: echo "Godkjenning gitt – startar produksjonsdeploy"
  build-and-deploy:
    needs: godkjenn
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -- --base /
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Add CNAME and disable Jekyll
        run: |
          echo "res.hesteskokasting.no" > dist/CNAME
          touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: dev/

name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  godkjenn:
    runs-on: ubuntu-latest
    environment: prod-godkjenning
    steps:
      - run: echo "Godkjenning gitt – startar produksjonsdeploy"
  build-and-deploy:
    needs: godkjenn
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      # vp version is auto-detected from the vite-plus devDependency + lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Replaces the `tsc --noEmit` gate that `npm run build` used to provide;
      # also covers fmt and lint (lint.options.typeCheck is on in vite.config.js).
      - run: vp check
      - run: vp build --base /
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
      - name: Add CNAME and disable Jekyll
        run: |
          echo "res.hesteskokasting.no" > dist/CNAME
          touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: dev/

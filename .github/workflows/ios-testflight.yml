name: iOS TestFlight

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server URL override, e.g. https://res.hesteskokasting.no/dev (empty = production)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    environment: testflight

    steps:
      - uses: actions/checkout@v5

      # vp version is auto-detected from the vite-plus devDependency + lockfile.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Replaces the `tsc --noEmit` gate that `npm run build` used to provide;
      # also covers fmt and lint (lint.options.typeCheck is on in vite.config.js).
      - name: Check formatting, lint and types
        run: vp check

      - name: Build web assets
        run: vp build --base /
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}

      # capacitor.config.ts treats an empty CAPACITOR_SERVER_URL as set, so only
      # export it when the input is non-empty — otherwise production is used.
      - name: Sync Capacitor iOS
        run: |
          if [ -n "${{ inputs.server_url }}" ]; then
            export CAPACITOR_SERVER_URL="${{ inputs.server_url }}"
            echo "::warning::Building against non-production server: ${{ inputs.server_url }}"
          fi
          vp exec cap sync ios

      # GoogleSignIn returns to the app via a custom URL scheme (the reversed iOS
      # client ID). Injected at build time instead of committed, so the client ID
      # lives only in the environment secrets like the other VITE_* values.
      - name: Register Google Sign-In URL scheme
        env:
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "::error::Secret VITE_GOOGLE_IOS_CLIENT_ID is not set in the testflight environment"
            exit 1
          fi
          SCHEME="com.googleusercontent.apps.${VITE_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" \
            ios/App/App/Info.plist

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ios/App/SourcePackages

      # Version comes from package.json (same source as Android's versionName);
      # the build number auto-increments via the workflow run number.
      - name: Archive
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath ios/App/SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$APP_VERSION" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      # destination=upload makes xcodebuild upload straight to App Store Connect,
      # replacing the deprecated `altool --upload-app`.
      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

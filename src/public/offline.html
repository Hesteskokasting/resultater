<!doctype html>
<html lang="nn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hesteskokasting</title>
    <!-- Native error page (server.errorPath): must be self-contained, nothing from the network loads here. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #212529;
        --accent: #0d6efd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #212529;
          --fg: #dee2e6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      button {
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.375rem;
        font-size: 1rem;
        background: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Kunne ikkje laste</h1>
    <p>Sjekk nettilkoplinga og prøv igjen.</p>
    <button type="button" id="retry">Prøv igjen</button>
    <script>
      // ponytail: always retries production; a dev build lands on prod here, restart the app to get dev back.
      const retry = () => location.replace("https://res.hesteskokasting.no");
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
    </script>
  </body>
</html>

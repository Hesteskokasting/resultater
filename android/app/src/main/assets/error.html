<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingen tilkobling</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #111318;
        color: #e2e4e9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #9299a8;
        margin: 0 0 24px;
      }
      a.retry {
        display: inline-block;
        padding: 12px 28px;
        background: #31527e;
        color: #f0f4fa;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Ingen internettforbindelse</h1>
      <p>Sjekk tilkoblingen din og prøv igjen.</p>
      <a class="retry" href="https://res.hesteskokasting.no" id="retry">Prøv igjen</a>
    </div>
    <script>
      // The failed URL is passed in by MainActivity so retry targets whichever
      // server.url is actually configured (prod, dev, or a local dev server),
      // not a hardcoded host the WebView might refuse to navigate to.
      // Only accept http(s) targets — the WebView can land here after failing to
      // load any main-frame navigation, so this string isn't trustworthy and must
      // never be allowed to become a javascript:/data:/intent: URI on the link.
      var params = new URLSearchParams(location.search);
      var target = params.get("url");
      if (target) {
        try {
          var parsed = new URL(target, location.href);
          if (parsed.protocol === "http:" || parsed.protocol === "https:") {
            document.getElementById("retry").href = parsed.href;
          }
        } catch (e) {
          // Leave the default retry href in place.
        }
      }
    </script>
  </body>
</html>
